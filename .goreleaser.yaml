version: 2

# Keep archive names lowercase (gocode_<ver>_<os>_<arch>) to match the npm
# fetch script and historical releases; GoReleaser otherwise derives "GoCode"
# from the repository directory name.
project_name: gocode

before:
  hooks:
    - go mod tidy

builds:
  - id: gocode
    main: ./cmd/gocode/
    binary: gocode
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}
      - -X github.com/mevarx/GoCode/internal/version.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: ['tar.gz']
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ['zip']

checksum:
  name_template: "checksums.txt"

release:
  # v0.7.4 is re-pointed for the security remediation; update the existing
  # release in place instead of failing when asset names already exist.
  replace_existing_artifacts: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
