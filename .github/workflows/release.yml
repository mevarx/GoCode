name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Delete existing release assets
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
              console.log('Deleted existing release ' + tag);
            } catch (e) {
              console.log('No existing release for ' + tag + ', skipping');
            }

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        if: ${{ secrets.NPM_TOKEN != '' }}
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish npm shim (gocode-cli)
        if: ${{ secrets.NPM_TOKEN != '' }}
        working-directory: npm
        run: |
          pwsh -NoProfile -File scripts/fetch-binaries.ps1 -Version ${GITHUB_REF_NAME#v}
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
